<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviewBoard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="progress" aria-hidden="true"><div class="progress-value" id="progress-value"></div></div>

    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>RB</span></div>
        <div class="brand-text">
          <h1 id="repo-name">ReviewBoard</h1>
          <p id="repo-meta">waiting for configuration…</p>
        </div>
      </div>

      <nav class="view-switch" role="tablist" aria-label="Views">
        <button type="button" class="view-tab is-active" id="tab-prs" role="tab" aria-selected="true" aria-controls="grid" title="Open Pull Requests (P)">
          <span>Pull Requests</span>
          <span class="tab-badge" id="tab-pr-count">0</span>
        </button>
        <button type="button" class="view-tab" id="tab-scoreboard" role="tab" aria-selected="false" aria-controls="scoreboard-view" title="Reviewer Scoreboard & Gamification (S)">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M8 21h8m-4-4v4"></path>
              <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
              <path d="M7 6H4v2a3 3 0 0 0 3 3m10-5h3v2a3 3 0 0 1-3 3"></path>
            </svg>
            Scoreboard
          </span>
          <span class="tab-badge score-badge" id="tab-score-badge">10d</span>
        </button>
      </nav>

      <div class="stats" id="stats" aria-label="Review summary"></div>

      <div class="controls">
        <button type="button" class="icon-btn" id="theme-toggle" data-tooltip="Switch theme (T)" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="sound-toggle" data-tooltip="Sound alerts off" aria-label="Sound alerts" aria-pressed="false">
          <svg class="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
          </svg>
          <svg class="icon-bell-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-9.3-5M6 8c0 7-3 7-3 9h15"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
            <path d="m3 3 18 18"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn hide-in-popup" id="wallboard-toggle" data-tooltip="Wallboard mode (W)" aria-label="Wallboard mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M9 4v16M15 4v16"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn hide-in-popup" id="fullscreen-toggle" data-tooltip="Full screen (F)" aria-label="Full screen" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
        <button type="button" class="refresh-btn" id="refresh" title="Refresh now (R)" aria-label="Refresh now">
          <svg viewBox="0 0 44 44" aria-hidden="true" focusable="false">
            <circle class="ring-track" cx="22" cy="22" r="19"></circle>
            <circle class="ring-value" id="ring-progress" cx="22" cy="22" r="19"></circle>
          </svg>
          <span class="refresh-label"><span id="countdown">–</span><small>s</small></span>
        </button>
        <a class="icon-btn" id="settings-link" href="options.html" target="_blank" rel="noopener" data-tooltip="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.66 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.66 8.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.07A1.7 1.7 0 0 0 15.06 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </a>
        <button type="button" class="icon-btn popup-only" id="open-tab" data-tooltip="Open in a new tab" aria-label="Open in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="banner" id="banner" role="alert" hidden></div>
      <section class="grid" id="grid" role="tabpanel" aria-labelledby="tab-prs"></section>
      <section class="scoreboard-view" id="scoreboard-view" role="tabpanel" aria-labelledby="tab-scoreboard" hidden></section>
      <div class="empty" id="empty" hidden></div>
    </main>

    <footer class="statusbar">
      <span class="live-dot" id="live-dot" aria-hidden="true"></span>
      <span id="status-line">Starting…</span>
      <span class="spacer"></span>
      <span id="quota"></span>
      <span class="status-sep" aria-hidden="true">|</span>
      <span id="updated"></span>
    </footer>

    <script src="lib/browser-api.js"></script>
    <script src="lib/bitbucket.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
